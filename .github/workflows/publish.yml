name: Publish

# Builds the CloudStream 3 plugins from decodede/cs-code@main and publishes the
# artifacts into THIS repo, which is the repo CloudStream users install from.
#
# Why this lives here rather than in cs-code: a workflow in cs-code cannot write
# to cs-repo with its own GITHUB_TOKEN, and cross-repo writes would require a PAT
# stored as an Actions secret. cs-code is public, so this workflow reads it with
# no credential and pushes to cs-repo with its own native GITHUB_TOKEN. No
# repository secrets are required.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cs3-publish]
  schedule:
    # Daily rebuild so upstream source-site changes get picked up automatically.
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout cs-code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Public repo, read without any credential. `path` keeps the artifact
          # workspace (cs-repo) separate from the build tree (src).
          repository: decodede/cs-code
          ref: main
          path: src

      - name: Checkout cs-repo (publish target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: dist

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          (cd "$SDK_ROOT/cmdline-tools" && jar xf /tmp/cmdline-tools.zip)
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          chmod +x "$SDK_ROOT"/cmdline-tools/latest/bin/* 2>/dev/null || true
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build plugins from source
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/src"
          touch local.properties
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Collect artifacts
        run: |
          set -e
          SRC="$GITHUB_WORKSPACE/src"
          DIST="$GITHUB_WORKSPACE/dist"

          # Every published file is regenerated from scratch; nothing is carried over.
          cd "$DIST"
          git rm -q --cached -r --ignore-unmatch . > /dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          count=0
          while IFS= read -r -d '' f; do
            cp "$f" "$DIST/"
            count=$((count + 1))
          done < <(find "$SRC" -path "*/build/*.cs3" -print0)

          if [ "$count" -eq 0 ]; then
            echo "FAIL: no .cs3 artifacts were produced by the build"
            exit 1
          fi

          cp "$SRC/plugins.json" "$DIST/plugins.json"
          cp "$SRC/repo.json"    "$DIST/repo.json"

          # Keep the workflow itself; it must survive the wipe above.
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/workflows/publish.yml" .github/workflows/publish.yml

          echo "Published $count plugin artifact(s):"
          ls -1 "$DIST" | grep -E '\.cs3$' | sed 's/^/  /'

      - name: Verify published manifest is self-consistent
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/dist"
          python3 - <<'PY'
          import json, hashlib, pathlib, sys

          # plugins.json is a top-level ARRAY of plugin objects (not {"plugins": [...]}).
          plugins = json.loads(pathlib.Path("plugins.json").read_text())
          repo    = json.loads(pathlib.Path("repo.json").read_text())
          problems = []

          if not isinstance(plugins, list):
              sys.exit(f"FAIL: plugins.json is {type(plugins).__name__}, expected list")

          listed = []
          for p in plugins:
              name = p["url"].rsplit("/", 1)[-1]   # no "file" key; name comes from the url
              listed.append(name)
              if "raw.githubusercontent.com/decodede/cs-repo/main/" not in p["url"]:
                  problems.append(f"{name}: url not on cs-repo@main -> {p['url']}")
              if p.get("repositoryUrl", "").rstrip("/") != "https://github.com/decodede/cs-repo":
                  problems.append(f"{name}: repositoryUrl wrong -> {p.get('repositoryUrl')}")
              if "raw.githubusercontent.com/decodede/cs-code/main/icons/" not in p.get("iconUrl", ""):
                  problems.append(f"{name}: iconUrl not on cs-code@main -> {p.get('iconUrl')}")

              blob = pathlib.Path(name)
              if not blob.is_file():
                  problems.append(f"{name}: published file missing from repo root")
                  continue
              if p.get("fileSize") != blob.stat().st_size:
                  problems.append(f"{name}: fileSize {p.get('fileSize')} != on-disk {blob.stat().st_size}")
              # fileHash guards against publishing a stale/partial artifact.
              want = p.get("fileHash", "")
              if want.startswith("sha256-"):
                  got = hashlib.sha256(blob.read_bytes()).hexdigest()
                  if got != want[len("sha256-"):]:
                      problems.append(f"{name}: sha256 mismatch (manifest {want[7:15]}.. vs file {got[:8]}..)")

          for entry in repo["pluginLists"]:
              if "raw.githubusercontent.com/decodede/cs-repo/main/" not in entry:
                  problems.append(f"repo.json pluginList not on cs-repo@main -> {entry}")
          if "raw.githubusercontent.com/decodede/cs-code/main/" not in repo["iconUrl"]:
              problems.append(f"repo.json iconUrl not on cs-code@main -> {repo['iconUrl']}")

          on_disk = sorted(q.name for q in pathlib.Path(".").glob("*.cs3"))
          if sorted(listed) != on_disk:
              problems.append(f"plugins.json {sorted(listed)} != on-disk {on_disk}")

          if problems:
              print("FAIL:", *problems, sep="\n  ")
              sys.exit(1)
          print(f"OK: {len(listed)} plugin(s) consistent across plugins.json, repo.json, disk and sha256")
          PY

      - name: Commit and push artifacts
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/dist"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Publish CloudStream 3 plugins from cs-code@${GITHUB_SHA:0:7}"
            git push origin HEAD:main
            echo "Pushed published artifacts to decodede/cs-repo@main"
          else
            echo "No changes to push - published artifacts already current"
          fi
